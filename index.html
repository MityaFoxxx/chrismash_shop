<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christmas Shop - Магические подарки на Новый год</title>
  
  <!-- SEO Meta Tags -->

  <meta name="author" content="Christmas Shop" />
  <meta name="robots" content="index, follow" />
  <meta name="language" content="Russian" />
  
  <!-- Open Graph Meta Tags для социальных сетей -->
  <meta property="og:title" content="Christmas Shop - Магические подарки на Новый год" />
  <meta property="og:description" content="Откройте для себя магические новогодние подарки. Уникальные товары для гармонии, здоровья и работы." />
  <meta property="og:type" content="website" />

  <meta property="og:image" content="/bg_ball.png" />
  <meta property="og:site_name" content="Christmas Shop" />
  <meta property="og:locale" content="ru_RU" />
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Christmas Shop - Магические подарки на Новый год" />
  <meta name="twitter:description" content="Откройте для себя магические новогодние подарки. Уникальные товары для гармонии, здоровья и работы." />

  <meta name="msapplication-TileColor" content="#dc2626" />
  <link rel="canonical" href="https://christmas-shop.com" />
  
  <!-- Preload критических ресурсов для производительности -->
  <!-- Preconnect для Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Preload критических изображений первого экрана -->
  <link rel="preload" href="/bg_ball.png" as="image" />
  <link rel="preload" href="/bg_snow.png" as="image" />
  <link rel="preload" href="/snowflake.svg" as="image" />
  
  <!-- Preload шрифтов -->
  <link rel="preload" href="/node_modules/@fontsource/montserrat/files/montserrat-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/node_modules/@fontsource/allura/files/allura-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  
  <!-- DNS prefetch для внешних ресурсов -->
